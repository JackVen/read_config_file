# Configuration File for temperature sensor
[global]
sensor_model = STM32F031K6T
operational_max_temp = 105
operational_min_temp = -40
cal_ts1 = 0x1FFFF7B8 # memory address for the ts1 calibration value
cal_ts2 = 0x1FFFF7C2 # memory address for the ts2 calibration value
adc_resolution = 12 # 12-bit resolution
adc_data_aligment = right
log_file = /read_config_file/read_file.log
